name: Follow MYDS upstream

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tokens with the latest @govtechmy/myds-style
        id: sync
        run: |
          python3 tools/sync_upstream.py > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- tools/tokens.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(python3 -c 'import json;print(json.load(open("tools/tokens.json"))["upstream"]["version"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the theme files
        if: steps.sync.outputs.changed == 'true'
        run: python3 tools/build.py

      - name: Open a pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          branch="upstream/myds-style-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; nothing to do."
            exit 0
          fi
          git config user.name "DRMSR"
          git config user.email "me@drmsr.dev"
          git switch -c "$branch"
          git add -A
          git commit -m "Follow @govtechmy/myds-style $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Follow @govtechmy/myds-style $VERSION" \
            --body-file "$RUNNER_TEMP/summary.md"
